# Google Stitch as an MCP server for DeepSeek Harness.
#
# Google publishes Stitch as a remote MCP endpoint that authenticates with an API
# key in a header — the same shape their setup docs show for other MCP clients:
#
#   "servers": { "stitch": {
#     "type": "http",
#     "url": "https://stitch.googleapis.com/mcp",
#     "headers": { "X-Goog-Api-Key": "AQ...." } } }
#
# So this row uses the Streamable HTTP transport with the key as a header. The key
# never lives in this file: the Host half (index.js) resolves the stored
# credential into process.env.STITCH_API_KEY before this row activates.
- insert:
    # Bundle's own Host entry: publishes stored credentials into process.env and
    # mounts the Client half (the credential card).
    - id: dsh-stitch-mcp
      name: 'dsh-stitch-mcp'
      config: {}
    - id: stitch-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: stitch
        transport: streamable-http
        url: https://stitch.googleapis.com/mcp
        headers:
          X-Goog-Api-Key: !!js "process.env.STITCH_API_KEY || ''"
        # Keep the harness healthy when the endpoint is unreachable; the failure is
        # logged instead of rejecting plugin activation.
        failOnStartupError: false
        # stitch_generate starts a backend job, so allow more than the 60s default.
        toolCallTimeoutMs: 120000
