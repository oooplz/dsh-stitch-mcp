# Google Stitch as an MCP server for DeepSeek Harness.
#
# Stitch is a remote MCP endpoint documented as:
#
#   { "type": "http", "url": "https://stitch.googleapis.com/mcp",
#     "headers": { "X-Goog-Api-Key": "AQ...." } }
#
# The endpoint is only reachable through a proxy on many networks, and the
# Streamable HTTP transport runs inside the Harness process, which cannot be given
# the proxy flag by a plugin. The Host half therefore starts relay.js — a child
# process that owns the proxy flag and the credential header — and this row talks
# to that relay on localhost. relay.js forwards the same requests unchanged.
- insert:
    # Bundle's own Host entry: publishes stored credentials, starts the relay and
    # mounts the Client half (the credential card).
    - id: dsh-stitch-mcp
      name: 'dsh-stitch-mcp'
      config: {}
    - id: stitch-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: stitch
        transport: streamable-http
        url: http://127.0.0.1:7788/mcp
        # No credential header here on purpose: the relay owns it. A `!!js` value
        # can be evaluated before this bundle's Host half runs, which would send an
        # empty X-Goog-Api-Key and shadow the real one.
        # Keep the harness healthy when the endpoint is unreachable; the failure is
        # logged instead of rejecting plugin activation.
        failOnStartupError: false
        # Large tool catalog and job-starting calls need more than the 60s default.
        toolCallTimeoutMs: 120000
