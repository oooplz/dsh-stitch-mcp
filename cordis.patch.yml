# Google Stitch as an MCP server for DeepSeek Harness.
#
# Stitch is a remote MCP endpoint documented as:
#
#   { "type": "http", "url": "https://stitch.googleapis.com/mcp",
#     "headers": { "X-Goog-Api-Key": "AQ...." } }
#
# The row talks to it directly. Nothing here routes the traffic:
#
# * direct is the default, so a network that reaches Google needs no configuration;
# * a proxied network is the user's own choice. The Host half wraps undici's global
#   dispatcher (index.js + proxy.js) and routes *only* `stitch.googleapis.com` through
#   the address the card stored; with the switch off, nothing of ours is in the path and
#   the harness policy (`HTTPS_PROXY` / `ALL_PROXY`, exported or in `$DSH_HOME/.env`)
#   decides for every origin, this one included. Nothing is written to `$DSH_HOME/.env`
#   any more, and a switch flip applies in the running process;
# * an unreachable endpoint stays an honest transport error instead of a fake
#   connection, and `~/.dsh/dsh-runtimes/stitch-mcp/status.json` records the reason.
#
# `headers` carries the credential, and config expressions are evaluated before any
# plugin runs, so the value is read synchronously from the runtime `config.json` the
# Host half maintains. When the card saves a new credential, that file changes and
# the Host half asks the plugin manager to compose this entry again, which is how the
# new header applies without restarting the harness.
#
# Keep the two rows in this order: the Host half is what writes `config.json`.
- insert:
    # Bundle's own Host entry: publishes stored credentials, keeps the proxy block in
    # `$DSH_HOME/.env`, writes the status file and reloads the row below on a change.
    - id: dsh-stitch-mcp
      name: 'dsh-stitch-mcp'
      config: {}
    - id: stitch-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: stitch
        transport: streamable-http
        url: https://stitch.googleapis.com/mcp
        # Only the credential headers are built, and only the ones that exist, so an
        # empty value can never shadow a real one. File paths mirror index.js:
        # `$DSH_HOME` or `~/.dsh`, then `dsh-runtimes/stitch-mcp/config.json`.
        headers: !!js "(() => { try { const fs = process.getBuiltinModule('fs'), path = process.getBuiltinModule('path'), os = process.getBuiltinModule('os'), home = process.env.DSH_HOME || path.join(os.homedir(), '.dsh'), config = JSON.parse(fs.readFileSync(path.join(home, 'dsh-runtimes', 'stitch-mcp', 'config.json'), 'utf8')), headers = {}; if (typeof config.accessToken === 'string' && config.accessToken) headers.Authorization = 'Bearer ' + config.accessToken; else if (typeof config.apiKey === 'string' && config.apiKey) headers['X-Goog-Api-Key'] = config.apiKey; if (typeof config.projectId === 'string' && config.projectId) headers['X-Goog-User-Project'] = config.projectId; return headers; } catch (error) { return {}; } })()"
        # Keep the harness healthy while the endpoint is unreachable; the failure is
        # logged instead of rejecting plugin activation.
        failOnStartupError: false
        # Large tool catalog and job-starting calls need more than the 60s default.
        toolCallTimeoutMs: 120000
        # A row that gave up stays dead (`maxAttempts` is one-way), so the Host half
        # also reloads this entry when a credential or proxy appears. Until then, keep
        # retrying with a bounded delay; a connection that survives 3s resets the budget.
        reconnect:
          enabled: true
          initialDelayMs: 300
          maxDelayMs: 3000
          maxAttempts: 200
